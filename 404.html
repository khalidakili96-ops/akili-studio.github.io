<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2D2C2A">
  <title>Page Not Found | Akili Studio</title>
  <style>
    :root{--charcoal:#2D2C2A;--gold:#b68a3a;--paper:#f7f5f1}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--charcoal)}
    body{display:grid;place-items:center;font-family:Arial,sans-serif}
    main{width:min(720px,calc(100% - 48px));padding:72px 0}
    .mark{width:54px;height:54px;margin-bottom:56px}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#777}
    h1{font-family:"Caviar Dreams",Arial,sans-serif;font-size:clamp(42px,7vw,76px);font-weight:400;line-height:.98;margin:16px 0 24px}
    p{max-width:520px;font-size:16px;line-height:1.7;color:#666;margin:0 0 36px}
    a{display:inline-block;color:var(--charcoal);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:7px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/assets/favicon.svg" alt="Akili Studio">
    <div class="eyebrow">404 · Page not found</div>
    <h1>This space no longer exists.</h1>
    <p>The page you are looking for may have moved. Return to Akili Studio and continue exploring our work.</p>
    <a href="/">Return to Akili Studio</a>
  </main>
</body>
</html>
