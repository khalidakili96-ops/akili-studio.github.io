name: Restore Akili logo asset

on:
  push:

permissions:
  contents: write

jobs:
  restore-logo:
    if: github.event.head_commit.message != 'Restore official Akili logo asset'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact historical logo asset
        run: git checkout fba4192cee36e612b15752b6221345d00bd643e3 -- assets/akili-logo.svg

      - name: Commit restored asset and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/akili-logo.svg .github/workflows/restore-akili-logo.yml
          git commit -m "Restore official Akili logo asset" || exit 0
          git rm .github/workflows/restore-akili-logo.yml
          git commit --amend --no-edit
          git push
